<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>شات المهندس</title>
  <style>
    /* Reset */
    * { box-sizing: border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:#000; /* أسود كامل */
      color:#fff;
      direction: rtl;
    }

    /* Login page (ثابتة) */
    .login-page {
      position: fixed;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.85));
      z-index: 100;
    }
    .login-card {
      width: 420px;
      background: rgba(10,10,10,0.95);
      border: 1px solid rgba(255,215,0,0.08);
      padding: 28px;
      border-radius: 12px;
      text-align: center;
    }
    .gold-title {
      color: #dfb632; /* ذهبي */
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(223,182,50,0.12);
    }
    .subtitle {
      color: #f3e7b0;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .form-row { margin-bottom: 12px; text-align: right; }
    .form-row label { display:block; margin-bottom:6px; color:#ddd; text-align:right; font-size:14px; }
    .form-row input {
      width:100%;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color:#fff;
      font-size:15px;
    }
    .btn {
      display:inline-block;
      padding:10px 16px;
      border-radius:10px;
      background: linear-gradient(90deg,#dfb632,#f6d86b);
      color:#111;
      font-weight:800;
      cursor:pointer;
      border:none;
      margin-top:8px;
      box-shadow: 0 6px 20px rgba(223,182,50,0.12);
    }

    /* Main chat layout */
    .app {
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:stretch;
    }
    header {
      padding:18px 12px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,0.04);
      background: linear-gradient(90deg, rgba(0,0,0,0.6), rgba(0,0,0,0.8));
    }
    header h1 {
      color:#dfb632;
      font-size:24px;
      font-weight:900;
      margin:0;
      text-shadow:0 2px 6px rgba(0,0,0,0.6);
    }

    .content {
      flex:1;
      display:flex;
      gap:12px;
      padding:14px;
      align-items:stretch;
    }

    /* Messages column */
    .chat-col {
      flex:1;
      display:flex;
      flex-direction:column;
      height: calc(100vh - 140px);
      border:1px solid rgba(255,255,255,0.03);
      border-radius:10px;
      overflow:hidden;
      background: rgba(0,0,0,0.45);
    }

    .messages {
      flex:1;
      overflow:auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .msg {
      max-width:75%;
      padding:10px 14px;
      border-radius:8px;
      background: rgba(255,255,255,0.03);
      color:#fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      align-self:flex-start;
      word-break: break-word;
    }
    .msg.me { align-self:flex-end; background: rgba(255,255,255,0.06); color:#fff; }
    .msg .msg-user {
      font-weight:800;
      margin-bottom:6px;
      color: #f1f1f1;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .msg .msg-user .owner {
      color: #dfb632;
      font-weight:900;
    }
    .msg .msg-time {
      font-size:12px;
      color: #bfbfbf;
      margin-top:8px;
      text-align:left;
    }
    .msg .quote {
      margin-bottom:8px;
      padding:8px;
      border-left: 3px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      font-size:13px;
      color:#eaeaea;
    }
    .system {
      text-align:center;
      color:#bfbfbf;
      font-size:13px;
      opacity:0.95;
    }

    /* Right column (participants/settings) */
    .side-col {
      width:300px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .panel {
      background: rgba(255,255,255,0.02);
      border-radius:10px;
      padding:12px;
      border:1px solid rgba(255,255,255,0.03);
    }
    .participants-list {
      max-height:300px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .participant {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px;
      border-radius:8px;
      background: transparent;
      color:#f1f1f1;
    }
    .participant .name { font-weight:700; }
    .participant .owner { color:#dfb632; font-weight:900; }

    /* Composer */
    .composer {
      display:flex;
      gap:8px;
      padding:12px;
      border-top:1px solid rgba(255,255,255,0.03);
      align-items:center;
      background: rgba(0,0,0,0.5);
    }
    .composer .input {
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .composer input[type="text"] {
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
      color:#fff;
      font-size:15px;
    }
    .composer .buttons { display:flex; gap:6px; align-items:center; }
    .icon-btn {
      background: rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.04);
      color:#fff;
      padding:8px;
      border-radius:8px;
      cursor:pointer;
    }

    /* Reply indicator */
    .reply-indicator {
      background: rgba(255,255,255,0.02);
      padding:8px;
      border-left:3px solid rgba(255,255,255,0.06);
      border-radius:6px;
      font-size:13px;
      color:#f1f1f1;
    }

    /* Emoji bar */
    .emoji-bar {
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .emoji-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size:18px;
      cursor:pointer;
    }

    /* file preview link */
    .file-link { color:#dcdcdc; text-decoration:underline; cursor:pointer; }

    /* settings */
    .settings input[type="color"] { width:48px; height:34px; border:none; background:transparent; }

    /* responsive */
    @media (max-width: 900px) {
      .side-col { display:none; }
      .msg { max-width: 92%; }
      .login-card { width:92%; }
    }
  </style>
</head>
<body>
  <!-- Login (ثابتة) -->
  <div class="login-page" id="loginPage">
    <div class="login-card" role="dialog" aria-modal="true">
      <div class="gold-title">شات المهندس</div>
      <div class="subtitle">مرحباً بكم في عالم المهندس</div>

      <div class="form-row">
        <label for="login-username">اسم المستخدم</label>
        <input id="login-username" type="text" autocomplete="username" placeholder="اسم المستخدم..." />
      </div>

      <div class="form-row">
        <label for="login-password">كلمة السر</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="كلمة السر..." />
      </div>

      <div>
        <button class="btn" id="loginBtn">دخول</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="app" style="display:none;">
    <header><h1>شات المهندس</h1></header>

    <div class="content">
      <div class="chat-col">
        <div class="messages" id="messages"></div>

        <!-- composer -->
        <div class="composer">
          <div class="input">
            <div id="replyBox" style="display:none;" class="reply-indicator">
              <span id="replyText"></span>
              <button id="cancelReply" class="icon-btn" title="إلغاء الرد">✖</button>
            </div>
            <input id="messageInput" type="text" placeholder="اكتب رسالة..." />
            <div class="emoji-bar" id="emojiBar" aria-hidden="false">
              <!-- quick emojis -->
              <button class="emoji-btn">😀</button>
              <button class="emoji-btn">😂</button>
              <button class="emoji-btn">😍</button>
              <button class="emoji-btn">👍</button>
              <button class="emoji-btn">🔥</button>
              <button class="emoji-btn">🎉</button>
            </div>
          </div>

          <div class="buttons">
            <input type="file" id="fileInput" style="display:none;" />
            <button class="icon-btn" id="attachBtn" title="إرفاق ملف/صورة">📎</button>
            <button class="icon-btn" id="replyBtn" title="اقتَباس/رد">↩</button>
            <button class="btn" id="sendBtn">إرسال</button>
          </div>
        </div>
      </div>

      <div class="side-col">
        <div class="panel">
          <h3 style="margin-bottom:8px;">المتواجدون الآن</h3>
          <div class="participants-list" id="participants"></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:8px;">الإعدادات</h3>
          <div style="margin-bottom:8px;">
            <label style="display:block;margin-bottom:6px;color:#ddd;">تغيير الاسم</label>
            <input id="settingName" type="text" placeholder="اسم العرض" />
            <button class="btn" id="saveName" style="margin-top:8px;">حفظ الاسم</button>
          </div>
          <div>
            <label style="display:block;margin-bottom:6px;color:#ddd;">خلفيتي (لون)</label>
            <input id="bgColor" type="color" value="#000000" />
            <button class="btn" id="saveBg" style="margin-top:8px;">حفظ الخلفية</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Client-side script
    const socket = io('/chat', { transports: ['websocket'], reconnection: true });

    // State
    let username = null;
    let isOwner = false;
    let replyTo = null; // { id, username, text } or null
    const messagesEl = document.getElementById('messages');
    const participantsEl = document.getElementById('participants');

    // Login elements
    const loginPage = document.getElementById('loginPage');
    const loginBtn = document.getElementById('loginBtn');
    const loginUsername = document.getElementById('login-username');
    const loginPassword = document.getElementById('login-password');

    // App elements
    const appEl = document.getElementById('app');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const emojiBar = document.getElementById('emojiBar');
    const replyBtn = document.getElementById('replyBtn');
    const replyBox = document.getElementById('replyBox');
    const replyText = document.getElementById('replyText');
    const cancelReply = document.getElementById('cancelReply');
    const participantsList = document.getElementById('participants');

    const settingName = document.getElementById('settingName');
    const saveName = document.getElementById('saveName');
    const bgColor = document.getElementById('bgColor');
    const saveBg = document.getElementById('saveBg');

    // Helpers
    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        return iso;
      }
    }

    function createMessageElement(msg, me=false) {
      if (msg.type === 'system') {
        const el = document.createElement('div');
        el.className = 'system';
        el.textContent = msg.text + ' · ' + fmtTime(msg.time);
        return el;
      }

      const el = document.createElement('div');
      el.className = 'msg' + (me ? ' me' : '');
      // user
      const userDiv = document.createElement('div');
      userDiv.className = 'msg-user';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = msg.username;
      if (msg.is_owner) {
        nameSpan.classList.add('owner');
        nameSpan.textContent = msg.username + ' 👑';
      }
      userDiv.appendChild(nameSpan);
      el.appendChild(userDiv);

      // quoted (reply_to)
      if (msg.reply_to && msg.reply_to_preview) {
        const q = document.createElement('div');
        q.className = 'quote';
        q.textContent = `${msg.reply_to_preview.username}: ${msg.reply_to_preview.text || '[محتوى مرفق]'}`;
        el.appendChild(q);
      }

      // text or file
      if (msg.text) {
        const txt = document.createElement('div');
        txt.textContent = msg.text;
        el.appendChild(txt);
      }

      if (msg.file) {
        // if image, show preview
        const f = msg.file;
        const ext = (f.filename || '').split('.').pop().toLowerCase();
        if (["png","jpg","jpeg","gif","webp"].includes(ext)) {
          const img = document.createElement('img');
          img.src = f.url;
          img.style.maxWidth = '320px';
          img.style.display = 'block';
          img.style.marginTop = '8px';
          img.style.borderRadius = '6px';
          el.appendChild(img);
        } else {
          const a = document.createElement('a');
          a.href = f.url;
          a.target = '_blank';
          a.className = 'file-link';
          a.textContent = 'فتح الملف: ' + f.filename;
          el.appendChild(a);
        }
      }

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = fmtTime(msg.time);
      el.appendChild(time);

      // attach reply action on click
      el.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        // on right-click, set reply
        setReply({ id: msg.id, username: msg.username, text: msg.text });
      });

      // Also add small reply button on hover -- simplified by adding double-click
      el.addEventListener('dblclick', () => {
        setReply({ id: msg.id, username: msg.username, text: msg.text });
      });

      return el;
    }

    function appendMessage(msg) {
      // build reply_preview for messages that reference another message id
      if (msg.reply_to) {
        // find referenced message in DOM or in history; simplified: server may include preview in message.reply_to_preview
        // If not present, show placeholder
        if (!msg.reply_to_preview) {
          msg.reply_to_preview = { username: 'رسالة سابقة', text: '[محتوى مقتبس]' };
        }
      }
      const el = createMessageElement(msg, msg.username === username);
      messagesEl.prepend(el); // newest at top-like feel; scroll behavior can be adjusted
    }

    function renderHistory(history) {
      messagesEl.innerHTML = '';
      // history is oldest->newest; render newest last so it appears at top if using prepend
      for (let i = history.length - 1; i >= 0; i--) {
        appendMessage(history[i]);
      }
    }

    function renderParticipants(presence) {
      participantsList.innerHTML = '';
      presence.forEach(p => {
        const div = document.createElement('div');
        div.className = 'participant';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = p.username + (p.is_owner ? ' 👑' : '');
        if (p.is_owner) name.classList.add('owner');
        div.appendChild(name);
        participantsList.appendChild(div);
      });
    }

    // Reply handling
    function setReply(r) {
      replyTo = r;
      replyBox.style.display = 'flex';
      replyText.textContent = `${r.username}: ${r.text ? r.text.slice(0,140) : '[مرفق]'}`;
    }
    cancelReply.addEventListener('click', () => {
      replyTo = null;
      replyBox.style.display = 'none';
    });

    // Emoji buttons
    emojiBar.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        messageInput.value += btn.textContent;
        messageInput.focus();
      });
    });

    // Attach file
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch('/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
          // send a message with file info (and optional text)
          socket.emit('message', {
            text: '',
            file: { url: data.url, filename: data.filename, mimetype: file.type },
            reply_to: replyTo ? replyTo.id : null
          }, (ack) => {
            // clear reply
            replyTo = null;
            replyBox.style.display = 'none';
            fileInput.value = '';
          });
        } else {
          alert('فشل رفع الملف: ' + (data.error || 'unknown'));
        }
      } catch (e) {
        alert('خطأ في رفع الملف');
      }
    });

    // Send message
    sendBtn.addEventListener('click', () => {
      const txt = messageInput.value.trim();
      const payload = { text: txt, reply_to: replyTo ? replyTo.id : null };
      if (!txt && !replyTo) return;
      socket.emit('message', payload, (ack) => {
        if (ack && ack.status === 'ok') {
          // optimistic UI: server will broadcast back; we can clear input
          messageInput.value = '';
          replyTo = null;
          replyBox.style.display = 'none';
        } else {
          alert('فشل إرسال الرسالة');
        }
      });
    });
    messageInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // Reply button toggles an instruction to right-click/double-click to reply
    replyBtn.addEventListener('click', () => {
      alert('للرد على رسالة اضغط مزدوجًا عليها أو انقر بزر الفأرة الأيمن عليها ثم اضغط "إلغاء الرد" لإلغاء.');
    });

    // Settings: change name
    saveName.addEventListener('click', () => {
      const newName = settingName.value.trim();
      if (!newName) { alert('أدخل اسمًا صالحًا'); return; }
      socket.emit('update_profile', { new_name: newName }, (resp) => {
        if (resp && resp.status === 'ok') {
          username = newName;
          alert('تم تحديث الاسم');
        } else {
          alert('فشل تحديث الاسم');
        }
      });
    });

    // Settings: change background color
    saveBg.addEventListener('click', () => {
      const c = bgColor.value || '#000000';
      document.body.style.background = c;
      // store in localStorage (client-only)
      localStorage.setItem('chat_bg', c);
      // inform server of bg (optional)
      socket.emit('update_profile', { bg: c }, (resp) => {});
    });

    // Persist background
    const savedBg = localStorage.getItem('chat_bg');
    if (savedBg) document.body.style.background = savedBg;

    // Socket events
    socket.on('connect', () => {
      console.log('connected to server');
    });

    socket.on('connected', (data) => {
      // optional server welcome
    });

    socket.on('system_message', (msg) => {
      // msg: { id, type: 'system', text, time }
      appendMessage(msg);
    });

    socket.on('message', (msg) => {
      // msg: { id, type: 'message', username, is_owner, text, file, reply_to, time }
      // Optionally, server may not include reply_to_preview; not critical.
      appendMessage(msg);
    });

    socket.on('presence_update', (data) => {
      if (data && data.presence) {
        renderParticipants(data.presence);
      }
    });

    // Initial login flow
    loginBtn.addEventListener('click', doLogin);
    loginUsername.addEventListener('keyup', (e) => { if (e.key === 'Enter') doLogin(); });
    loginPassword.addEventListener('keyup', (e) => { if (e.key === 'Enter') doLogin(); });

    function doLogin() {
      const name = loginUsername.value.trim();
      const pw = loginPassword.value;
      if (!name) { alert('أدخل اسم مستخدم'); return; }
      // emit join: server will validate owner if name matches OWNER_USERNAME
      socket.emit('join', { username: name, password: pw }, (resp) => {
        if (!resp) { alert('خطأ في الاتصال'); return; }
        if (resp.status === 'error') {
          if (resp.reason === 'invalid_owner_password') {
            alert('كلمة مرور المالك غير صحيحة.');
            return;
          } else {
            alert('خطأ: ' + resp.reason);
            return;
          }
        }
        // success
        username = name;
        isOwner = (name === "{{OWNER_USERNAME}}" || name === "المهندس"); // visual hint; actual owner determined by server events
        // hide login, show app
        loginPage.style.display = 'none';
        appEl.style.display = 'flex';
        // render history and presence
        if (resp.history) renderHistory(resp.history);
        if (resp.presence) renderParticipants(resp.presence);
        // set settings input default
        settingName.value = username;
      });
    }

    // Right after page load, we can attach keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // cancel reply
        replyTo = null;
        replyBox.style.display = 'none';
      }
    });

    // Receive initial presence/history if server emits them on connect? Server sends on join ack.

    // Small UX: tooltip showing how to reply
    (function showReplyHint() {
      // no-op for brevity; you can show a small toast if desired
    })();
  </script>
</body>
</html>
