<!doctype html>
<!-- templates/index.html -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>شات المهندس</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --accent: #0b5ed7;
      --muted: #6c757d;
      --owner-gold: #d4af37;
      --owner-bg: linear-gradient(90deg,#fff7e6,#fff3d1);
    }
    html,body { height:100%; margin:0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background:var(--bg); color:#111827; }
    .app { max-width:980px; margin:20px auto; background:var(--panel); border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,0.08); overflow:hidden; display:flex; flex-direction:column; min-height:82vh; }
    header { padding:16px 20px; border-bottom:1px solid #eef2ff; display:flex; align-items:center; justify-content:space-between; background:linear-gradient(90deg,#ffffff,#f8fbff); }
    header h1 { margin:0; font-size:20px; color:var(--accent); }
    .status { font-size:13px; color:var(--muted); }
    .content { display:flex; flex:1; min-height:0; }
    .sidebar { width:260px; border-left:1px solid #f1f5f9; padding:14px; background:#fbfdff; box-sizing:border-box; }
    .main { flex:1; display:flex; flex-direction:column; padding:14px; min-height:0; }
    .room-list, .participants { list-style:none; padding:0; margin:0; }
    .room-list li, .participants li { padding:8px 10px; border-radius:6px; margin-bottom:6px; cursor:pointer; color:#0f1724; display:flex; justify-content:space-between; align-items:center; }
    .room-list li.active { background:rgba(11,94,215,0.08); color:var(--accent); font-weight:600; }
    .participants li.owner { font-weight:700; color:var(--owner-gold); background:var(--owner-bg); }
    .messages { flex:1; overflow:auto; padding:8px; display:flex; flex-direction:column-reverse; gap:8px; }
    .message { max-width:75%; padding:10px 12px; border-radius:10px; background:#eef2ff; color:#042a56; align-self:flex-start; box-shadow:0 1px 2px rgba(2,6,23,0.04); }
    .message.me { background:#d1e7dd; color:#0f5132; align-self:flex-end; }
    .message .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
    .message.owner { border:1px solid rgba(212,175,55,0.2); background:linear-gradient(90deg,#fff8e6,#fff5d1); color:#543e00; }
    .message .username-owner { color:var(--owner-gold); font-weight:800; margin-left:6px; }
    .system { text-align:center; color:var(--muted); font-size:13px; margin:6px 0; }
    .compose { display:flex; gap:8px; padding-top:10px; border-top:1px solid #f1f5f9; }
    .compose input[type="text"], .compose input[type="password"] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #e6edf8; font-size:15px; }
    .compose button { background:var(--accent); color:white; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
    .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(4,6,15,0.35); z-index:50; }
    .card { width:420px; background:white; border-radius:10px; padding:18px; box-shadow:0 10px 40px rgba(2,6,23,0.18); }
    .card h2 { margin:0 0 12px 0; font-size:18px; color:#042a56; }
    .form-row { margin-bottom:10px; }
    .form-row label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    .form-row input { width:100%; padding:9px 12px; border-radius:8px; border:1px solid #e6edf8; font-size:14px; }
    .tiny { font-size:12px; color:var(--muted); margin-top:8px; }
    footer { padding:10px 14px; font-size:13px; color:var(--muted); text-align:center; border-top:1px solid #f1f5f9; }
    .badge { padding:4px 8px; border-radius:999px; background:#f1f5f9; font-weight:600; color:#0b5ed7; font-size:12px; }
    @media (max-width:900px) { .sidebar { display:none; } .card { width:92%; } }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="شات المهندس">
    <header>
      <h1>شات المهندس</h1>
      <div class="status">
        الحالة:
        <span id="connStatus" class="badge">غير متصل</span>
        <span id="latency" style="margin-left:10px;color:var(--muted);"></span>
      </div>
    </header>

    <div class="content">
      <div class="main" role="main">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
          <div style="flex:1;font-size:14px;color:var(--muted);">الغرفة: <strong id="currentRoom">main</strong></div>
          <div style="font-size:13px;color:var(--muted);">المستخدم: <strong id="currentUser">غير مسجل</strong></div>
        </div>

        <div id="messagesContainer" class="messages" aria-live="polite" aria-relevant="additions"></div>

        <div class="compose" role="region" aria-label="منطقة كتابة الرسائل">
          <input id="messageInput" type="text" placeholder="اكتب رسالتك..." autocomplete="off" />
          <button id="sendBtn">إرسال</button>
        </div>

        <div class="tiny" id="queueInfo" style="display:none;">يوجد رسائل في الطابور سيتم إرسالها عند استعادة الاتصال.</div>
      </div>

      <aside class="sidebar" aria-label="قائمة الغرف والمشاركين">
        <div style="font-weight:700;margin-bottom:8px;">غرف متاحة</div>
        <ul class="room-list" id="rooms">
          <li data-room="main" class="active">عام</li>
          <li data-room="support">دعم</li>
          <li data-room="projects">مشروعات</li>
        </ul>

        <div style="font-weight:700;margin-top:18px;margin-bottom:8px;">المتواجدون</div>
        <ul class="participants" id="participants">
          <!-- Participants will be rendered here -->
        </ul>
      </aside>
    </div>

    <footer>شات المهندس — جاهز للنشر</footer>
  </div>

  <!-- Login / Join overlay -->
  <div class="overlay" id="loginOverlay" aria-hidden="false">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
      <h2 id="joinTitle">مرحبًا — سجّل دخولك إلى شات المهندس</h2>

      <div class="form-row">
        <label for="username">الاسم</label>
        <input id="username" type="text" maxlength="40" placeholder="مثال: أحمد المهندس" />
      </div>

      <div class="form-row">
        <label for="password">كلمة المرور (مطلوبة فقط للمستخدم "المهندس")</label>
        <input id="password" type="password" maxlength="80" placeholder="كلمة المرور إن كنت المالك" />
      </div>

      <div class="form-row">
        <label for="roomSelect">اختر الغرفة</label>
        <input id="roomSelect" type="text" maxlength="40" value="main" />
        <div class="tiny">يمكنك استخدام أسماء غرف جديدة أو اختيار واحدة من القائمة.</div>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
        <button id="joinBtn" style="background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;">دخول</button>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // UI refs
    const overlay = document.getElementById('loginOverlay');
    const joinBtn = document.getElementById('joinBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const roomInput = document.getElementById('roomSelect');
    const connStatus = document.getElementById('connStatus');
    const latency = document.getElementById('latency');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentRoomLabel = document.getElementById('currentRoom');
    const currentUserLabel = document.getElementById('currentUser');
    const queueInfo = document.getElementById('queueInfo');
    const roomsList = document.getElementById('rooms');
    const participantsList = document.getElementById('participants');

    // State
    let socket = null;
    let username = null;
    let room = 'main';
    let connected = false;
    let msgQueue = [];
    let latencyTimer = null;

    // Helper to sanitize text (simple)
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, function(m){ return map[m]; });
    }

    // Add message to DOM
    function addMessageToDOM(msg, opts = {}) {
      const el = document.createElement('div');
      let classes = 'message';
      if (opts.me) classes += ' me';
      if (msg.is_owner) classes += ' owner';
      el.className = classes;

      if (msg.type === 'system') {
        const sys = document.createElement('div');
        sys.className = 'system';
        sys.textContent = msg.text + ' · ' + msg.time;
        // prepend for column-reverse
        messagesContainer.prepend(sys);
        return;
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      // If owner, show gold name with crown
      if (msg.is_owner) {
        const nameSpan = document.createElement('span');
        nameSpan.className = 'username-owner';
        nameSpan.textContent = `${msg.username} 👑`;
        meta.appendChild(nameSpan);
        const timeSpan = document.createElement('span');
        timeSpan.style.marginLeft = '8px';
        timeSpan.style.color = 'var(--muted)';
        timeSpan.textContent = msg.time;
        meta.appendChild(timeSpan);
      } else {
        meta.textContent = `${msg.username} • ${msg.time}`;
      }

      const body = document.createElement('div');
      body.textContent = msg.text;

      el.appendChild(meta);
      el.appendChild(body);
      messagesContainer.prepend(el);
    }

    // Render history (array oldest->newest)
    function renderHistory(history) {
      messagesContainer.innerHTML = '';
      for (let i = history.length - 1; i >= 0; i--) {
        const m = history[i];
        addMessageToDOM({
          type: m.type,
          username: m.username || '',
          text: m.text || '',
          time: m.time || '',
          is_owner: !!m.is_owner
        }, { me: m.username === username });
      }
    }

    // Render participants list
    function renderParticipants(presence) {
      participantsList.innerHTML = '';
      presence.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.username + (p.is_owner ? ' 👑' : '');
        if (p.is_owner) li.classList.add('owner');
        participantsList.appendChild(li);
      });
    }

    // Room selection
    roomsList.addEventListener('click', (ev) => {
      const li = ev.target.closest('li[data-room]');
      if (!li) return;
      const selected = li.getAttribute('data-room');
      if (selected === room) return;
      roomsList.querySelectorAll('li').forEach(n => n.classList.remove('active'));
      li.classList.add('active');
      if (connected && socket) {
        socket.emit('leave', { username, room }, (ack) => {
          // ignore
        });
        room = selected;
        currentRoomLabel.textContent = room;
        socket.emit('join', { username, room, password: passwordInput.value }, (resp) => {
          if (resp && resp.status === 'ok') {
            renderHistory(resp.history || []);
            renderParticipants(resp.presence || []);
            flushQueue();
          } else if (resp && resp.status === 'error') {
            if (resp.reason === 'invalid_owner_password') {
              alert('كلمة مرور المالك غير صحيحة.');
              // Keep user out of owner identity; force overlay to show again
              overlay.style.display = 'flex';
            }
          }
        });
      } else {
        room = selected;
        currentRoomLabel.textContent = room;
      }
    });

    // Join action
    joinBtn.addEventListener('click', startChat);
    usernameInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') startChat(); });
    passwordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') startChat(); });
    roomInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') startChat(); });

    function startChat() {
      const name = (usernameInput.value || '').trim();
      const pw = (passwordInput.value || '').trim();
      const r = (roomInput.value || 'main').trim() || 'main';
      if (!name) { alert('الرجاء إدخال اسمك'); usernameInput.focus(); return; }
      username = name;
      room = r;
      currentUserLabel.textContent = username;
      currentRoomLabel.textContent = room;
      overlay.style.display = 'none';

      initSocket(() => {
        // After connected, emit join with password if any
        socket.emit('join', { username, room, password: pw }, (resp) => {
          if (resp && resp.status === 'ok') {
            renderHistory(resp.history || []);
            renderParticipants(resp.presence || []);
            flushQueue();
            // If an owner joined (this client is owner) and server returned ok, server already broadcast system message.
          } else if (resp && resp.status === 'error') {
            if (resp.reason === 'invalid_owner_password') {
              alert('كلمة مرور المالك غير صحيحة.');
              // show overlay again for correction
              overlay.style.display = 'flex';
            } else {
              alert('فشل في الانضمام: ' + (resp.reason || 'خطأ غير معروف'));
              overlay.style.display = 'flex';
            }
          }
        });
      });
    }

    // Initialize socket with robust options
    function initSocket(callback) {
      if (socket) {
        try { socket.disconnect(); } catch (e) {}
        socket = null;
      }

      socket = io('/chat', {
        transports: ['websocket'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        timeout: 20000
      });

      socket.on('connect', () => {
        connected = true;
        connStatus.textContent = 'متصل';
        connStatus.style.background = '#dcfce7';
        connStatus.style.color = '#0f5132';
        latency.textContent = '';
        if (typeof callback === 'function') callback();
      });

      socket.on('disconnect', (reason) => {
        connected = false;
        connStatus.textContent = 'غير متصل';
        connStatus.style.background = '';
        connStatus.style.color = '';
        latency.textContent = '';
      });

      socket.on('connect_error', (err) => {
        connected = false;
        connStatus.textContent = 'خطأ بالاتصال';
      });

      socket.io.on('reconnect_attempt', (attempt) => {
        connStatus.textContent = `إعادة الاتصال... (${attempt})`;
      });

      socket.io.on('reconnect', (attempt) => {
        connStatus.textContent = 'متصل';
      });

      socket.on('connected', (data) => {
        // welcome from server
      });

      socket.on('system_message', (msg) => {
        addMessageToDOM({ type: 'system', text: msg.text, time: msg.time });
      });

      socket.on('message', (msg) => {
        addMessageToDOM({
          type: 'message',
          username: msg.username,
          text: msg.text,
          time: msg.time,
          is_owner: !!msg.is_owner
        }, { me: msg.username === username });
      });

      socket.on('presence_update', (data) => {
        if (data && data.presence) {
          renderParticipants(data.presence);
        }
      });

      socket.on('pong_server', (data) => {
        const clientTs = data.ts;
        const serverTs = data.server_ts;
        if (clientTs && !isNaN(Number(clientTs))) {
          const rtt = Date.now() - Number(clientTs);
          latency.textContent = `زمن الرحلة: ${rtt} ms`;
        } else {
          latency.textContent = `متصل · ${serverTs}`;
        }
      });

      // Heartbeat ping
      if (latencyTimer) clearInterval(latencyTimer);
      latencyTimer = setInterval(() => {
        if (socket && socket.connected) {
          socket.emit('ping_server', { ts: Date.now() });
        }
      }, 5000);
    }

    // Send message (queue when offline)
    function sendMessage() {
      const text = (messageInput.value || '').trim();
      if (!text) return;
      const client_id = `c_${Date.now()}_${Math.floor(Math.random()*1000)}`;
      const payload = { username, room, text, client_id };
      // Optimistic UI
      addMessageToDOM({
        type: 'message',
        username,
        text,
        time: new Date().toISOString(),
        is_owner: (username === 'المهندس' && passwordInput.value === 'samy779h') // visual hint if local
      }, { me: true });
      messageInput.value = '';
      if (connected && socket && socket.connected) {
        socket.timeout(5000).emit('message', payload, (resp) => {
          if (!resp || resp.status !== 'ok') {
            msgQueue.push(payload);
            queueInfo.style.display = 'block';
          }
        });
      } else {
        msgQueue.push(payload);
        queueInfo.style.display = 'block';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') sendMessage(); });

    function flushQueue() {
      if (!msgQueue.length || !connected || !socket) {
        queueInfo.style.display = msgQueue.length ? 'block' : 'none';
        return;
      }
      const pending = msgQueue.slice();
      msgQueue = [];
      queueInfo.style.display = 'none';
      let idx = 0;
      function sendNext() {
        if (idx >= pending.length) return;
        const payload = pending[idx++];
        socket.timeout(5000).emit('message', payload, (resp) => {
          if (!resp || resp.status !== 'ok') {
            msgQueue.push(payload);
            queueInfo.style.display = 'block';
          }
          setTimeout(sendNext, 120);
        });
      }
      sendNext();
    }

    // Auto-focus input after closing overlay
    document.addEventListener('click', () => {
      if (!overlay || overlay.style.display === 'none') {
        messageInput.focus();
      }
    });

    window.addEventListener('beforeunload', () => {
      try { if (socket) socket.disconnect(); } catch (e) {}
    });
  </script>
</body>
  </html>
